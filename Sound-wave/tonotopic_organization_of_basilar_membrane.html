<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Tonotopic Organization</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: clamp(15px, 3vw, 40px);
    }

    .container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(25px, 5vw, 70px);
    }

    .controls {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: clamp(20px, 3vw, 40px);
      flex-shrink: 0;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .slider-label {
      font-size: clamp(13px, 1.5vw, 17px);
      text-align: center;
      white-space: nowrap;
    }

    .slider-value {
      font-size: clamp(13px, 1.4vw, 16px);
      font-weight: bold;
      min-height: 20px;
    }

    input[type="range"].vertical {
      writing-mode: vertical-lr;
      direction: rtl;
      height: clamp(170px, 35vh, 300px);
      width: 28px;
      cursor: pointer;
      margin: 0;
      padding: 0;
    }

    .right-panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(12px, 2vw, 20px);
    }

    .canvas-container {
      width: 100%;
      max-width: 750px;
      aspect-ratio: 16 / 9;
      min-height: 200px;
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      border: 1px solid #000;
      background: #ffffff;
    }

    .play-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 18px;
    }

    button {
      padding: 10px 28px;
      font-size: clamp(14px, 1.5vw, 17px);
      cursor: pointer;
      border: 1px solid #999;
      background: #f3f3f3;
      border-radius: 6px;
      min-width: 90px;
    }

    button:hover { background: #e8e8e8; }

    .mute-control {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: clamp(14px, 1.5vw, 17px);
      cursor: pointer;
      user-select: none;
    }

    .mute-control input {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    @media (max-width: 700px) {
      body { align-items: flex-start; }

      .container {
        flex-direction: column;
        gap: 30px;
      }

      .controls {
        width: 100%;
        gap: clamp(35px, 12vw, 80px);
      }

      input[type="range"].vertical {
        height: clamp(150px, 28vh, 220px);
      }

      .right-panel { width: 100%; }

      .canvas-container {
        width: 100%;
        max-width: 100%;
      }
    }

    @media (max-width: 400px) {
      body { padding: 12px; }

      .slider-label { font-size: 13px; }

      .controls { gap: 25px; }

      input[type="range"].vertical { height: 150px; }

      .canvas-container { min-height: 180px; }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="controls">

      <div class="slider-group">
        <label class="slider-label" for="pitch">
          Frequency (pitch)
        </label>

        <input
          id="pitch"
          class="vertical"
          type="range"
          min="100"
          max="2000"
          value="1000"
          step="1"
        >

        <div id="frequencyValue" class="slider-value">
          1000 Hz
        </div>
      </div>

      <div class="slider-group">
        <label class="slider-label" for="intensity">
          Intensity (loudness)
        </label>

        <input
          id="intensity"
          class="vertical"
          type="range"
          min="0"
          max="100"
          value="50"
          step="1"
        >

        <div id="intensityValue" class="slider-value">
          50%
        </div>
      </div>

    </div>

    <div class="right-panel">

      <div class="canvas-container">
        <canvas id="waveCanvas"></canvas>
      </div>

      <div class="play-controls">

        <button id="toggleBtn">
          Play
        </button>

        <label class="mute-control">
          <input id="muteCheckbox" type="checkbox">
          Mute sound
        </label>

      </div>

    </div>

  </div>

  <script>

    let audioContext = null;
    let oscillator = null;
    let gainNode = null;
    let isPlaying = false;

    let animationFrameId = null;
    let animationStartTime = 0;

    const pitchSlider =
      document.getElementById("pitch");

    const intensitySlider =
      document.getElementById("intensity");

    const frequencyValue =
      document.getElementById("frequencyValue");

    const intensityValue =
      document.getElementById("intensityValue");

    const muteCheckbox =
      document.getElementById("muteCheckbox");

    const toggleBtn =
      document.getElementById("toggleBtn");

    const canvas =
      document.getElementById("waveCanvas");

    const ctx =
      canvas.getContext("2d");


    /* =====================================================
       AUDIO LEVEL
       ===================================================== */

    /*
      25% intensity gives gain 0.025, matching the
      previous fixed listening level.
    */
    const MAX_AUDIO_GAIN = 0.10;

    function getIntensityRatio() {
      return Number(intensitySlider.value) / 100;
    }

    function getAudioGain() {
      if (muteCheckbox.checked) {
        return 0;
      }

      return MAX_AUDIO_GAIN * getIntensityRatio();
    }


    /* =====================================================
       CANVAS RESIZING
       ===================================================== */

    function resizeCanvas() {

      const rect =
        canvas.getBoundingClientRect();

      const dpr =
        window.devicePixelRatio || 1;

      canvas.width =
        Math.round(rect.width * dpr);

      canvas.height =
        Math.round(rect.height * dpr);

      ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
      );

      drawDiagram();
    }


    /* =====================================================
       FREQUENCY -> PEAK POSITION
       ===================================================== */

    function getPeakRatioFromFrequency(frequency) {

      const minF =
        Number(pitchSlider.min);

      const maxF =
        Number(pitchSlider.max);

      const normalized =
        (frequency - minF) /
        (maxF - minF);

      /*
        0.00 = Base
        1.00 = Apex
      */
      const minPosition = 0.05;
      const maxPosition = 0.95;

      return maxPosition -
        normalized *
        (maxPosition - minPosition);
    }


    /* =====================================================
       DRAW DIAGRAM
       ===================================================== */

    function drawDiagram(animationTime = 0) {

      const rect =
        canvas.getBoundingClientRect();

      const w =
        rect.width;

      const h =
        rect.height;

      if (w <= 0 || h <= 0) {
        return;
      }

      const leftPadding =
        Math.max(55, w * 0.09);

      const rightPadding =
        Math.max(70, w * 0.09);

      const topPadding =
        Math.max(30, h * 0.09);

      const bottomPadding =
        Math.max(70, h * 0.20);

      const graphWidth =
        w - leftPadding - rightPadding;

      const membraneY =
        h - bottomPadding;

      const frequency =
        Number(pitchSlider.value);

      const intensityRatio =
        getIntensityRatio();

      /*
        Maximum height of the half-cycle at 100% intensity.
        The actual peak height scales with the intensity slider.
      */
      const maxWaveAmplitude =
        Math.min(
          (membraneY - topPadding) * 0.99,
          h * 0.66
        );

      const waveAmplitude =
        maxWaveAmplitude *
        intensityRatio;

      const peakRatio =
        getPeakRatioFromFrequency(frequency);

      const peakX =
        leftPadding +
        peakRatio * graphWidth;

      /*
        Peak occurs halfway through the half-cycle.
      */
      const halfCycleWidth =
        2 * (peakX - leftPadding);

      /*
        Clip the part of the wave that would extend
        beyond the Apex.
      */
      const visibleEndX =
        Math.min(
          leftPadding + halfCycleWidth,
          leftPadding + graphWidth
        );

      ctx.clearRect(
        0,
        0,
        w,
        h
      );


      /* ===================================================
         BASILAR MEMBRANE
         =================================================== */

      const membraneColor =
        "#0066ff";

      const membraneThickness =
        6.5;

      /*
        Width of the region that visibly vibrates.
      */
      const jitterWidth =
        Math.max(
          28,
          Math.min(
            50,
            graphWidth * 0.07
          )
        );

      /*
        Maximum visible displacement at 100% intensity.
      */
      const maxJitterAmplitude =
        Math.max(
          6,
          Math.min(
            14,
            h * 0.03
          )
        );

      /*
        Intensity directly controls vibration magnitude.
      */
      const jitterAmplitude =
        maxJitterAmplitude *
        intensityRatio;

      const jitterStartX =
        Math.max(
          leftPadding,
          peakX - jitterWidth / 2
        );

      const jitterEndX =
        Math.min(
          leftPadding + graphWidth,
          peakX + jitterWidth / 2
        );

      ctx.strokeStyle =
        membraneColor;

      ctx.lineWidth =
        membraneThickness;

      ctx.lineCap =
        "round";


      /*
        When stopped, or when intensity is zero,
        the membrane is straight.
      */
      if (
        !isPlaying ||
        intensityRatio === 0
      ) {

        ctx.beginPath();

        ctx.moveTo(
          leftPadding,
          membraneY
        );

        ctx.lineTo(
          w - rightPadding,
          membraneY
        );

        ctx.stroke();

      }

      else {

        /* Left straight portion */

        if (jitterStartX > leftPadding) {

          ctx.beginPath();

          ctx.moveTo(
            leftPadding,
            membraneY
          );

          ctx.lineTo(
            jitterStartX,
            membraneY
          );

          ctx.stroke();
        }


        /* Jittering membrane portion */

        const jitterPoints = 24;

        ctx.beginPath();

        for (
          let i = 0;
          i <= jitterPoints;
          i += 1
        ) {

          const proportion =
            i / jitterPoints;

          const x =
            jitterStartX +
            proportion *
            (
              jitterEndX -
              jitterStartX
            );

          /*
            Smoothly taper vibration to zero
            at the edges of the active region.
          */
          const envelope =
            Math.sin(
              Math.PI * proportion
            );

          /*
            Visual animation rate only.
            It is not the acoustic frequency.
          */
          const phase =
            2 *
            Math.PI *
            8 *
            animationTime +
            i * 1.15;

          const regularMotion =
            Math.sin(phase) *
            jitterAmplitude;

          const irregularMotion =
            Math.sin(
              phase * 1.73 +
              i * 0.8
            ) *
            jitterAmplitude *
            0.28;

          const displacement =
            (
              regularMotion +
              irregularMotion
            ) *
            envelope;

          const y =
            membraneY +
            displacement;

          if (i === 0) {
            ctx.moveTo(x, y);
          }
          else {
            ctx.lineTo(x, y);
          }
        }

        ctx.stroke();


        /* Right straight portion */

        if (
          jitterEndX <
          w - rightPadding
        ) {

          ctx.beginPath();

          ctx.moveTo(
            jitterEndX,
            membraneY
          );

          ctx.lineTo(
            w - rightPadding,
            membraneY
          );

          ctx.stroke();
        }
      }

      ctx.lineCap =
        "butt";


      /* ===================================================
         BASE / APEX END MARKS
         =================================================== */

      ctx.strokeStyle =
        membraneColor;

      ctx.lineWidth =
        membraneThickness;

      ctx.beginPath();

      ctx.moveTo(
        leftPadding,
        membraneY - 5
      );

      ctx.lineTo(
        leftPadding,
        membraneY + 5
      );

      ctx.moveTo(
        w - rightPadding,
        membraneY - 5
      );

      ctx.lineTo(
        w - rightPadding,
        membraneY + 5
      );

      ctx.stroke();


      /* ===================================================
         BASE / APEX LABELS
         =================================================== */

      ctx.fillStyle =
        "#000";

      const endLabelSize =
        Math.max(
          12,
          Math.min(
            17,
            w * 0.026
          )
        );

      ctx.font =
        `bold ${endLabelSize}px Arial`;

      ctx.textBaseline =
        "middle";

      ctx.textAlign =
        "right";

      ctx.fillText(
        "Base",
        leftPadding - 10,
        membraneY
      );

      ctx.textAlign =
        "left";

      ctx.fillText(
        "Apex",
        w - rightPadding + 10,
        membraneY
      );


      /* ===================================================
         BASILAR MEMBRANE LABEL
         =================================================== */

      const axisTitleSize =
        Math.max(
          12,
          Math.min(
            16,
            w * 0.027
          )
        );

      ctx.font =
        `bold ${axisTitleSize}px Arial`;

      ctx.textAlign =
        "center";

      ctx.textBaseline =
        "top";

      ctx.fillText(
        "Basilar Membrane",
        leftPadding +
        graphWidth / 2,
        membraneY + 22
      );


      /* ===================================================
         HALF-CYCLE WAVE
         =================================================== */

      ctx.beginPath();

      ctx.lineWidth = 2;

      ctx.strokeStyle =
        "#000";

      const safeWidth =
        Math.max(
          halfCycleWidth,
          1
        );

      const visibleSamples =
        Math.max(
          80,
          Math.round(
            visibleEndX -
            leftPadding
          )
        );

      for (
        let i = 0;
        i <= visibleSamples;
        i += 1
      ) {

        const x =
          leftPadding +
          (
            i /
            visibleSamples
          ) *
          (
            visibleEndX -
            leftPadding
          );

        const proportion =
          (
            x -
            leftPadding
          ) /
          safeWidth;

        const waveValue =
          Math.sin(
            Math.PI *
            proportion
          );

        const y =
          membraneY -
          waveAmplitude *
          waveValue;

        if (i === 0) {
          ctx.moveTo(x, y);
        }
        else {
          ctx.lineTo(x, y);
        }
      }

      ctx.stroke();


      /* ===================================================
         PEAK
         =================================================== */

      const peakY =
        membraneY -
        waveAmplitude;

      ctx.fillStyle =
        "#d92323";

      const pSize =
        Math.max(
          18,
          Math.min(
            26,
            w * 0.04
          )
        );

      ctx.font =
        `bold ${pSize}px Arial`;

      ctx.textAlign =
        "center";

      ctx.textBaseline =
        "bottom";

      ctx.fillText(
        "PEAK",
        peakX,
        peakY - 8
      );

      ctx.beginPath();

      ctx.arc(
        peakX,
        peakY,
        4,
        0,
        Math.PI * 2
      );

      ctx.fill();


      /* ===================================================
         GUIDE LINE FROM PEAK TO MEMBRANE
         =================================================== */

      ctx.save();

      ctx.strokeStyle =
        "#0066ff";

      ctx.lineWidth =
        1.5;

      ctx.setLineDash(
        [5, 5]
      );

      ctx.beginPath();

      ctx.moveTo(
        peakX,
        peakY + 7
      );

      ctx.lineTo(
        peakX,
        membraneY - 7
      );

      ctx.stroke();

      ctx.restore();


      /* Reset */

      ctx.strokeStyle =
        "#000";

      ctx.fillStyle =
        "#000";

      ctx.lineWidth =
        1;
    }


    /* =====================================================
       ANIMATION LOOP
       ===================================================== */

    function animate(timestamp) {

      if (!isPlaying) {

        animationFrameId =
          null;

        drawDiagram(0);

        return;
      }

      if (!animationStartTime) {

        animationStartTime =
          timestamp;
      }

      const elapsedSeconds =
        (
          timestamp -
          animationStartTime
        ) /
        1000;

      drawDiagram(
        elapsedSeconds
      );

      animationFrameId =
        requestAnimationFrame(
          animate
        );
    }


    function startAnimation() {

      animationStartTime =
        0;

      if (!animationFrameId) {

        animationFrameId =
          requestAnimationFrame(
            animate
          );
      }
    }


    function stopAnimation() {

      if (animationFrameId) {

        cancelAnimationFrame(
          animationFrameId
        );

        animationFrameId =
          null;
      }

      animationStartTime =
        0;

      drawDiagram(0);
    }


    /* =====================================================
       START PURE TONE
       ===================================================== */

    async function startTone() {

      const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;

      if (!AudioContextClass) {
        return;
      }

      if (!audioContext) {

        audioContext =
          new AudioContextClass();
      }

      if (
        audioContext.state ===
        "suspended"
      ) {

        await audioContext.resume();
      }

      oscillator =
        audioContext.createOscillator();

      gainNode =
        audioContext.createGain();

      oscillator.type =
        "sine";

      oscillator.frequency.setValueAtTime(
        Number(pitchSlider.value),
        audioContext.currentTime
      );

      gainNode.gain.setValueAtTime(
        0,
        audioContext.currentTime
      );

      gainNode.gain.linearRampToValueAtTime(
        getAudioGain(),
        audioContext.currentTime + 0.03
      );

      oscillator.connect(
        gainNode
      );

      gainNode.connect(
        audioContext.destination
      );

      oscillator.start();

      isPlaying =
        true;

      toggleBtn.textContent =
        "Stop";

      startAnimation();
    }


    /* =====================================================
       STOP PURE TONE
       ===================================================== */

    function stopTone() {

      if (
        !oscillator ||
        !audioContext ||
        !gainNode
      ) {

        isPlaying =
          false;

        toggleBtn.textContent =
          "Play";

        stopAnimation();

        return;
      }

      const now =
        audioContext.currentTime;

      gainNode.gain.cancelScheduledValues(
        now
      );

      gainNode.gain.setValueAtTime(
        gainNode.gain.value,
        now
      );

      gainNode.gain.linearRampToValueAtTime(
        0,
        now + 0.03
      );

      oscillator.stop(
        now + 0.04
      );

      oscillator =
        null;

      gainNode =
        null;

      isPlaying =
        false;

      toggleBtn.textContent =
        "Play";

      stopAnimation();
    }


    /* =====================================================
       PLAY / STOP
       ===================================================== */

    toggleBtn.addEventListener(
      "click",
      async () => {

        if (isPlaying) {
          stopTone();
        }
        else {
          await startTone();
        }
      }
    );


    /* =====================================================
       FREQUENCY
       ===================================================== */

    pitchSlider.addEventListener(
      "input",
      () => {

        const frequency =
          Number(pitchSlider.value);

        frequencyValue.textContent =
          frequency + " Hz";

        if (
          oscillator &&
          audioContext
        ) {

          oscillator.frequency.setTargetAtTime(
            frequency,
            audioContext.currentTime,
            0.01
          );
        }

        drawDiagram(0);
      }
    );


    /* =====================================================
       INTENSITY
       ===================================================== */

    intensitySlider.addEventListener(
      "input",
      () => {

        const intensity =
          Number(intensitySlider.value);

        intensityValue.textContent =
          intensity + "%";

        /*
          Change audible intensity immediately.
        */
        if (
          gainNode &&
          audioContext
        ) {

          gainNode.gain.setTargetAtTime(
            getAudioGain(),
            audioContext.currentTime,
            0.01
          );
        }

        /*
          Jitter magnitude also changes immediately.
        */
        drawDiagram(0);
      }
    );


    /* =====================================================
       MUTE / UNMUTE
       ===================================================== */

    muteCheckbox.addEventListener(
      "change",
      () => {

        /*
          Mute affects the audio only.
          The visual vibration continues while Play is active.
        */
        if (
          gainNode &&
          audioContext
        ) {

          gainNode.gain.setTargetAtTime(
            getAudioGain(),
            audioContext.currentTime,
            0.01
          );
        }
      }
    );


    /* =====================================================
       RESPONSIVE RESIZING
       ===================================================== */

    const resizeObserver =
      new ResizeObserver(() => {

        resizeCanvas();
      });

    resizeObserver.observe(
      canvas.parentElement
    );

    window.addEventListener(
      "resize",
      resizeCanvas
    );


    /* =====================================================
       INITIAL DRAW
       ===================================================== */

    resizeCanvas();

  </script>

</body>
</html>
