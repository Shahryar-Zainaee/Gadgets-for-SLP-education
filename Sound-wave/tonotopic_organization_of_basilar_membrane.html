<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Tonotopic Organization</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      min-width: 320px;

      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;

      width: 100%;
      min-width: 320px;
      min-height: 100vh;

      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #000;

      /*
        Center the complete tool as one unit so its overall
        organization stays stable on different desktop displays.
      */
      display: flex;
      align-items: center;
      justify-content: center;

      overflow-x: hidden;

      padding:
        clamp(12px, 2.2vw, 32px)
        clamp(12px, 2.5vw, 38px);
    }

    /*
      Use dynamic viewport height when available.
      The 100vh value above remains the fallback.
    */
    @supports (min-height: 100dvh) {
      body {
        min-height: 100dvh;
      }
    }

    /* =====================================================
       MAIN DESKTOP LAYOUT
       ===================================================== */

    .container {
      width: min(96vw, 1480px);

      margin: 0 auto;

      display: grid;

      /*
        Give the controls enough permanent horizontal room
        that labels do not unexpectedly wrap on ordinary
        desktop/laptop screens.

        The diagram receives the remaining space but never
        grows beyond a comfortable teaching size.
      */
      grid-template-columns:
        minmax(330px, 360px)
        minmax(0, 960px);

      align-items: center;
      justify-content: center;

      column-gap: clamp(28px, 3.2vw, 56px);
    }

    /* =====================================================
       LEFT CONTROLS
       ===================================================== */

    .controls {
      width: 100%;
      min-width: 0;

      display: grid;
      grid-template-columns:
        repeat(2, minmax(150px, 1fr));

      align-items: start;
      justify-items: center;

      gap: clamp(18px, 2vw, 30px);
    }

    .slider-group {
      width: 100%;
      min-width: 0;

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 10px;
    }

    .slider-label {
      width: 100%;
      min-height: 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: clamp(14px, 1.15vw, 17px);
      line-height: 1.2;

      text-align: center;

      /*
        Keep the desktop labels on one line, like the layout
        you preferred. They are allowed to wrap only at
        smaller breakpoints below.
      */
      white-space: nowrap;
    }

    .slider-value {
      min-height: 22px;

      font-size: clamp(14px, 1.1vw, 16px);
      line-height: 1.2;

      font-weight: bold;
      text-align: center;

      white-space: nowrap;
    }

    /* =====================================================
       CROSS-BROWSER VERTICAL SLIDERS
       ===================================================== */

    .vertical-slider-shell {
      --slider-length: clamp(205px, 28vh, 270px);

      position: relative;

      width: 46px;
      height: var(--slider-length);

      display: grid;
      place-items: center;

      flex: none;
    }

    /*
      A regular horizontal range is rotated vertically.
      This is more predictable than writing-mode across
      Chrome, Edge, Firefox, and Safari.
    */

    input[type="range"].vertical {
      --fill: 50%;

      -webkit-appearance: none;
      appearance: none;

      width: var(--slider-length);
      height: 28px;

      margin: 0;
      padding: 0;

      background: transparent;

      cursor: pointer;

      transform: rotate(-90deg);
      transform-origin: center;

      touch-action: manipulation;
    }

    /* Chrome / Edge / Safari */

    input[type="range"].vertical::-webkit-slider-runnable-track {
      width: 100%;
      height: 8px;

      border: 1px solid #b9b9b9;
      border-radius: 999px;

      background:
        linear-gradient(
          to right,
          #0d6efd 0%,
          #0d6efd var(--fill),
          #eeeeee var(--fill),
          #eeeeee 100%
        );
    }

    input[type="range"].vertical::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;

      width: 20px;
      height: 20px;

      margin-top: -7px;

      border: 0;
      border-radius: 50%;

      background: #0d6efd;
    }

    /* Firefox */

    input[type="range"].vertical::-moz-range-track {
      width: 100%;
      height: 8px;

      border: 1px solid #b9b9b9;
      border-radius: 999px;

      background:
        linear-gradient(
          to right,
          #0d6efd 0%,
          #0d6efd var(--fill),
          #eeeeee var(--fill),
          #eeeeee 100%
        );
    }

    input[type="range"].vertical::-moz-range-thumb {
      width: 20px;
      height: 20px;

      border: 0;
      border-radius: 50%;

      background: #0d6efd;
    }

    input[type="range"].vertical:focus-visible,
    button:focus-visible,
    .mute-control input:focus-visible {
      outline: 2px solid #111;
      outline-offset: 3px;
    }

    /* =====================================================
       RIGHT PANEL
       ===================================================== */

    .right-panel {
      width: 100%;
      min-width: 0;

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: clamp(14px, 1.5vw, 20px);
    }

    .canvas-container {
      width: 100%;
      max-width: 960px;
      min-width: 0;

      position: relative;

      aspect-ratio: 16 / 9;
    }

    canvas {
      display: block;

      width: 100%;
      height: 100%;

      max-width: 100%;

      border: 1px solid #000;
      background: #ffffff;
    }

    /*
      Fallback for older browsers without aspect-ratio.
    */
    @supports not (aspect-ratio: 16 / 9) {
      .canvas-container {
        height: 0;
        padding-top: 56.25%;
      }

      .canvas-container canvas {
        position: absolute;
        inset: 0;
      }
    }

    .play-controls {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;

      gap: 12px 26px;
    }

    button {
      min-width: 108px;
      min-height: 46px;

      padding: 9px 24px;

      font-family: inherit;
      font-size: clamp(15px, 1.15vw, 17px);

      cursor: pointer;

      border: 1px solid #999;
      border-radius: 6px;

      background: #f3f3f3;
      color: #000;
    }

    @media (hover: hover) and (pointer: fine) {
      button:hover {
        background: #e8e8e8;
      }
    }

    .mute-control {
      min-height: 46px;

      display: inline-flex;
      align-items: center;

      gap: 9px;

      font-size: clamp(15px, 1.15vw, 17px);

      cursor: pointer;
      user-select: none;

      white-space: nowrap;
    }

    .mute-control input {
      width: 20px;
      height: 20px;

      margin: 0;

      flex: 0 0 auto;

      cursor: pointer;

      accent-color: #0d6efd;
    }

    /* =====================================================
       MEDIUM DESKTOPS / SMALL LAPTOPS
       Keep side-by-side organization, but reduce sizes.
       ===================================================== */

    @media (max-width: 1180px) and (min-width: 861px) {

      .container {
        width: min(97vw, 1120px);

        grid-template-columns:
          minmax(300px, 330px)
          minmax(0, 1fr);

        column-gap: clamp(20px, 2.8vw, 36px);
      }

      .controls {
        grid-template-columns:
          repeat(2, minmax(135px, 1fr));

        gap: 16px;
      }

      .slider-label {
        font-size: 14px;
      }

      .vertical-slider-shell {
        --slider-length: clamp(185px, 27vh, 230px);
      }

      .canvas-container {
        max-width: 780px;
      }
    }

    /* =====================================================
       TABLETS / NARROW WINDOWS
       Stack the two major regions instead of squeezing them.
       ===================================================== */

    @media (max-width: 860px) {

      body {
        align-items: flex-start;

        padding-top: 18px;
        padding-bottom: 22px;
      }

      .container {
        width: min(96vw, 760px);

        grid-template-columns: minmax(0, 1fr);

        row-gap: 24px;
      }

      /*
        Put the visual diagram first on smaller screens.
      */
      .right-panel {
        order: 1;
      }

      .controls {
        order: 2;

        width: min(100%, 430px);

        margin: 0 auto;

        grid-template-columns:
          repeat(2, minmax(150px, 1fr));

        gap: clamp(24px, 8vw, 60px);
      }

      .canvas-container {
        width: 100%;
        max-width: 760px;
      }

      .slider-label {
        white-space: normal;
      }

      .vertical-slider-shell {
        --slider-length: 205px;
      }
    }

    /* =====================================================
       PHONES
       ===================================================== */

    @media (max-width: 520px) {

      body {
        padding:
          12px
          10px
          18px;
      }

      .container {
        width: 100%;

        row-gap: 20px;
      }

      .controls {
        width: 100%;

        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap: 12px;
      }

      .slider-label {
        min-height: 34px;

        font-size: 13px;
        white-space: normal;
      }

      .slider-value {
        font-size: 13px;
      }

      .vertical-slider-shell {
        --slider-length: 170px;

        width: 40px;
      }

      input[type="range"].vertical {
        height: 26px;
      }

      .play-controls {
        gap: 8px 16px;
      }

      button {
        min-width: 96px;
        min-height: 44px;

        font-size: 14px;
      }

      .mute-control {
        min-height: 44px;

        font-size: 14px;
      }
    }

    /* =====================================================
       VERY SMALL PHONES
       ===================================================== */

    @media (max-width: 360px) {

      body {
        padding-inline: 7px;
      }

      .controls {
        gap: 6px;
      }

      .slider-label {
        font-size: 12px;
      }

      .slider-value {
        font-size: 12px;
      }

      .vertical-slider-shell {
        --slider-length: 150px;
      }

      button {
        min-width: 90px;
        padding-inline: 16px;
      }
    }

    /* =====================================================
       SHORT DESKTOP / PROJECTOR WINDOWS
       ===================================================== */

    @media (min-width: 861px) and (max-height: 760px) {

      body {
        align-items: flex-start;

        padding-top: 14px;
        padding-bottom: 14px;
      }

      .vertical-slider-shell {
        --slider-length: 190px;
      }

      .canvas-container {
        max-width: 760px;
      }

      .container {
        column-gap: 30px;
      }
    }

    @media (min-width: 861px) and (max-height: 620px) {

      .vertical-slider-shell {
        --slider-length: 155px;
      }

      .canvas-container {
        max-width: 650px;
      }

      .slider-label,
      .slider-value {
        font-size: 13px;
      }

      button {
        min-height: 40px;
        padding-block: 6px;
      }

      .mute-control {
        min-height: 40px;
      }
    }

<body>

  <div class="container">

    <div class="controls">

      <div class="slider-group">
        <label class="slider-label" for="pitch">
          Frequency (pitch)
        </label>

        <div class="vertical-slider-shell">
          <input
            id="pitch"
            class="vertical"
            type="range"
            min="100"
            max="2000"
            value="1000"
            step="1"
            aria-label="Frequency in hertz"
          >
        </div>

        <div id="frequencyValue" class="slider-value">
          1000 Hz
        </div>
      </div>

      <div class="slider-group">
        <label class="slider-label" for="intensity">
          Intensity (loudness)
        </label>

        <div class="vertical-slider-shell">
          <input
            id="intensity"
            class="vertical"
            type="range"
            min="0"
            max="100"
            value="50"
            step="1"
            aria-label="Intensity percent"
          >
        </div>

        <div id="intensityValue" class="slider-value">
          50%
        </div>
      </div>

    </div>

    <div class="right-panel">

      <div class="canvas-container">
        <canvas id="waveCanvas"></canvas>
      </div>

      <div class="play-controls">

        <button id="toggleBtn">
          Play
        </button>

        <label class="mute-control">
          <input id="muteCheckbox" type="checkbox" checked>
          Mute sound
        </label>

      </div>

    </div>

  </div>

  <script>

    let audioContext = null;
    let oscillator = null;
    let gainNode = null;
    let isPlaying = false;

    let animationFrameId = null;
    let animationStartTime = 0;

    const pitchSlider =
      document.getElementById("pitch");

    const intensitySlider =
      document.getElementById("intensity");

    const frequencyValue =
      document.getElementById("frequencyValue");

    const intensityValue =
      document.getElementById("intensityValue");

    const muteCheckbox =
      document.getElementById("muteCheckbox");

    const toggleBtn =
      document.getElementById("toggleBtn");

    const canvas =
      document.getElementById("waveCanvas");

    const ctx =
      canvas.getContext("2d");


    /* =====================================================
       CROSS-BROWSER SLIDER APPEARANCE
       ===================================================== */

    function updateSliderFill(slider) {

      const min =
        Number(slider.min);

      const max =
        Number(slider.max);

      const value =
        Number(slider.value);

      const percent =
        (
          (value - min) /
          (max - min)
        ) *
        100;

      slider.style.setProperty(
        "--fill",
        percent + "%"
      );
    }


    /* =====================================================
       AUDIO LEVEL
       ===================================================== */

    /*
      25% intensity gives gain 0.025, matching the
      previous fixed listening level.
    */
    const MAX_AUDIO_GAIN = 0.10;

    function getIntensityRatio() {
      return Number(intensitySlider.value) / 100;
    }

    function getAudioGain() {
      if (muteCheckbox.checked) {
        return 0;
      }

      return MAX_AUDIO_GAIN * getIntensityRatio();
    }


    /* =====================================================
       CANVAS RESIZING
       ===================================================== */

    function resizeCanvas() {

      const rect =
        canvas.getBoundingClientRect();

      /*
        Cap DPR to avoid creating an unnecessarily huge
        canvas on very high-density displays.
      */
      const dpr =
        Math.min(
          window.devicePixelRatio || 1,
          2.5
        );

      const targetWidth =
        Math.max(
          1,
          Math.round(rect.width * dpr)
        );

      const targetHeight =
        Math.max(
          1,
          Math.round(rect.height * dpr)
        );

      if (
        canvas.width !== targetWidth ||
        canvas.height !== targetHeight
      ) {
        canvas.width =
          targetWidth;

        canvas.height =
          targetHeight;
      }

      ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
      );

      drawDiagram();
    }


    /* =====================================================
       COCHLEAR RESPONSE RELATIONSHIPS
       ===================================================== */

    function getFrequencyNormalized(frequency) {

      const minF =
        Number(pitchSlider.min);

      const maxF =
        Number(pitchSlider.max);

      const normalized =
        (frequency - minF) /
        (maxF - minF);

      return Math.max(
        0,
        Math.min(1, normalized)
      );
    }


    /*
      Frequency-place relationship used for this teaching
      visualization:

      Higher frequency -> closer to BASE
      Lower frequency  -> closer to APEX

      0.00 = Base
      1.00 = Apex
    */
    function getCharacteristicPlaceRatio(frequency) {

      const normalized =
        getFrequencyNormalized(frequency);

      const minPosition = 0.05;
      const maxPosition = 0.95;

      return maxPosition -
        normalized *
        (maxPosition - minPosition);
    }


    /*
      Peak LOCATION depends only on FREQUENCY.

      Intensity must not change the horizontal position
      of the peak or the horizontal duration/width of
      the half-cycle.
    */
    function getPeakRatio(frequency) {

      return getCharacteristicPlaceRatio(
        frequency
      );
    }


    /*
      BM response grows nonlinearly/compressively
      with increasing stimulus level.

      A power below 1 creates a simple schematic
      compressive-growth curve:
          0%   -> 0 response
          100% -> maximum response

      This is qualitative, not a fitted equation
      from the paper.
    */
    function getCompressedResponseRatio(
      intensityRatio
    ) {

      if (intensityRatio <= 0) {
        return 0;
      }

      return Math.pow(
        intensityRatio,
        0.65
      );
    }


    /* =====================================================
       DRAW DIAGRAM
       ===================================================== */

    function drawDiagram(animationTime = 0) {

      const rect =
        canvas.getBoundingClientRect();

      const w =
        rect.width;

      const h =
        rect.height;

      if (w <= 0 || h <= 0) {
        return;
      }

      /*
        Responsive drawing margins.
        Smaller minimums keep the diagram usable on phones
        and narrow browser windows without changing its logic.
      */
      const leftPadding =
        Math.max(40, w * 0.085);

      const rightPadding =
        Math.max(48, w * 0.09);

      const topPadding =
        Math.max(22, h * 0.08);

      const bottomPadding =
        Math.max(50, h * 0.18);

      const graphWidth =
        w - leftPadding - rightPadding;

      const membraneY =
        h - bottomPadding;

      const frequency =
        Number(pitchSlider.value);

      const intensityRatio =
        getIntensityRatio();

      /*
        Intensity affects only response magnitude.
        It does not change the horizontal cycle width
        or peak location.

        The illustrated magnitude grows compressively.
      */
      const responseRatio =
        getCompressedResponseRatio(
          intensityRatio
        );

      /*
        Maximum height of the half-cycle at 100% intensity.
        At 100%, the peak reaches the high level you selected.
      */
      const maxWaveAmplitude =
        Math.min(
          (membraneY - topPadding) * 0.99,
          h * 0.66
        );

      /*
        Peak HEIGHT grows compressively with intensity.
        Its horizontal location does not change.
      */
      const waveAmplitude =
        maxWaveAmplitude *
        responseRatio;

      /*
        Frequency alone determines the horizontal peak
        position and therefore the half-cycle width.

        Intensity changes only vertical magnitude.
      */
      const peakRatio =
        getPeakRatio(
          frequency
        );

      const peakX =
        leftPadding +
        peakRatio * graphWidth;

      /*
        Peak occurs halfway through the half-cycle.

        Because peakX depends only on frequency,
        changing intensity cannot change this
        horizontal half-cycle width.
      */
      const halfCycleWidth =
        2 * (peakX - leftPadding);

      /*
        Clip the part of the wave that would extend
        beyond the Apex.
      */
      const visibleEndX =
        Math.min(
          leftPadding + halfCycleWidth,
          leftPadding + graphWidth
        );

      ctx.clearRect(
        0,
        0,
        w,
        h
      );


      /* ===================================================
         BASILAR MEMBRANE
         =================================================== */

      const membraneColor =
        "#0066ff";

      const membraneThickness =
        6.5;

      /*
        The horizontal extent of the jittering region
        depends on frequency only, not intensity.

        Intensity changes only the vertical magnitude
        of the vibration.
      */

      const frequencyNormalized =
        getFrequencyNormalized(
          frequency
        );

      /*
        Lower frequency -> somewhat broader response.
        Higher frequency -> somewhat narrower response.

        This width remains fixed when intensity changes.
      */
      const frequencySpreadFactor =
        1 +
        (
          1 -
          frequencyNormalized
        ) *
        0.55;

      const baseJitterWidth =
        graphWidth * 0.10;

      const jitterWidth =
        Math.min(
          graphWidth * 0.22,
          baseJitterWidth *
          frequencySpreadFactor
        );

      /*
        Keep the visible vibration region centered
        exactly on the response peak.

        Therefore, the dashed PEAK guide line passes
        through the center of the jittering region.
      */
      const halfJitterWidth =
        jitterWidth / 2;

      /*
        Maximum visible displacement at 100% intensity.
      */
      const maxJitterAmplitude =
        Math.max(
          6,
          Math.min(
            14,
            h * 0.03
          )
        );

      /*
        Jitter magnitude follows the same compressive
        BM-response relationship as peak height.
      */
      const jitterAmplitude =
        maxJitterAmplitude *
        responseRatio;

      const jitterStartX =
        Math.max(
          leftPadding,
          peakX -
          halfJitterWidth
        );

      const jitterEndX =
        Math.min(
          leftPadding + graphWidth,
          peakX +
          halfJitterWidth
        );

      ctx.strokeStyle =
        membraneColor;

      ctx.lineWidth =
        membraneThickness;

      ctx.lineCap =
        "round";


      /*
        When stopped, or when intensity is zero,
        the membrane is straight.
      */
      if (
        !isPlaying ||
        intensityRatio === 0
      ) {

        ctx.beginPath();

        ctx.moveTo(
          leftPadding,
          membraneY
        );

        ctx.lineTo(
          w - rightPadding,
          membraneY
        );

        ctx.stroke();

      }

      else {

        /* Left straight portion */

        if (jitterStartX > leftPadding) {

          ctx.beginPath();

          ctx.moveTo(
            leftPadding,
            membraneY
          );

          ctx.lineTo(
            jitterStartX,
            membraneY
          );

          ctx.stroke();
        }


        /* Jittering membrane portion */

        const jitterPoints = 24;

        ctx.beginPath();

        for (
          let i = 0;
          i <= jitterPoints;
          i += 1
        ) {

          const proportion =
            i / jitterPoints;

          const x =
            jitterStartX +
            proportion *
            (
              jitterEndX -
              jitterStartX
            );

          /*
            Smoothly taper vibration to zero
            at the edges of the active region.
          */
          const envelope =
            Math.sin(
              Math.PI * proportion
            );

          /*
            Visual animation rate only.
            It is not the acoustic frequency.
          */
          const phase =
            2 *
            Math.PI *
            8 *
            animationTime +
            i * 1.15;

          const regularMotion =
            Math.sin(phase) *
            jitterAmplitude;

          const irregularMotion =
            Math.sin(
              phase * 1.73 +
              i * 0.8
            ) *
            jitterAmplitude *
            0.28;

          const displacement =
            (
              regularMotion +
              irregularMotion
            ) *
            envelope;

          const y =
            membraneY +
            displacement;

          if (i === 0) {
            ctx.moveTo(x, y);
          }
          else {
            ctx.lineTo(x, y);
          }
        }

        ctx.stroke();


        /* Right straight portion */

        if (
          jitterEndX <
          w - rightPadding
        ) {

          ctx.beginPath();

          ctx.moveTo(
            jitterEndX,
            membraneY
          );

          ctx.lineTo(
            w - rightPadding,
            membraneY
          );

          ctx.stroke();
        }
      }

      ctx.lineCap =
        "butt";


      /* ===================================================
         BASE / APEX END MARKS
         =================================================== */

      ctx.strokeStyle =
        membraneColor;

      ctx.lineWidth =
        membraneThickness;

      ctx.beginPath();

      ctx.moveTo(
        leftPadding,
        membraneY - 5
      );

      ctx.lineTo(
        leftPadding,
        membraneY + 5
      );

      ctx.moveTo(
        w - rightPadding,
        membraneY - 5
      );

      ctx.lineTo(
        w - rightPadding,
        membraneY + 5
      );

      ctx.stroke();


      /* ===================================================
         BASE / APEX LABELS
         =================================================== */

      ctx.fillStyle =
        "#000";

      const endLabelSize =
        Math.max(
          12,
          Math.min(
            17,
            w * 0.026
          )
        );

      ctx.font =
        `bold ${endLabelSize}px Arial`;

      ctx.textBaseline =
        "middle";

      ctx.textAlign =
        "right";

      ctx.fillText(
        "Base",
        leftPadding - 10,
        membraneY
      );

      ctx.textAlign =
        "left";

      ctx.fillText(
        "Apex",
        w - rightPadding + 10,
        membraneY
      );


      /* ===================================================
         BASILAR MEMBRANE LABEL
         =================================================== */

      const axisTitleSize =
        Math.max(
          12,
          Math.min(
            16,
            w * 0.027
          )
        );

      ctx.font =
        `bold ${axisTitleSize}px Arial`;

      ctx.textAlign =
        "center";

      ctx.textBaseline =
        "top";

      ctx.fillText(
        "Basilar Membrane",
        leftPadding +
        graphWidth / 2,
        membraneY + 22
      );


      /* ===================================================
         HALF-CYCLE WAVE
         =================================================== */

      ctx.beginPath();

      ctx.lineWidth = 2;

      ctx.strokeStyle =
        "#000";

      const safeWidth =
        Math.max(
          halfCycleWidth,
          1
        );

      const visibleSamples =
        Math.max(
          80,
          Math.round(
            visibleEndX -
            leftPadding
          )
        );

      for (
        let i = 0;
        i <= visibleSamples;
        i += 1
      ) {

        const x =
          leftPadding +
          (
            i /
            visibleSamples
          ) *
          (
            visibleEndX -
            leftPadding
          );

        const proportion =
          (
            x -
            leftPadding
          ) /
          safeWidth;

        const waveValue =
          Math.sin(
            Math.PI *
            proportion
          );

        const y =
          membraneY -
          waveAmplitude *
          waveValue;

        if (i === 0) {
          ctx.moveTo(x, y);
        }
        else {
          ctx.lineTo(x, y);
        }
      }

      ctx.stroke();


      /* ===================================================
         PEAK
         =================================================== */

      const peakY =
        membraneY -
        waveAmplitude;

      ctx.fillStyle =
        "#d92323";

      const pSize =
        Math.max(
          18,
          Math.min(
            26,
            w * 0.04
          )
        );

      ctx.font =
        `bold ${pSize}px Arial`;

      ctx.textAlign =
        "center";

      ctx.textBaseline =
        "bottom";

      ctx.fillText(
        "PEAK",
        peakX,
        peakY - 8
      );

      ctx.beginPath();

      ctx.arc(
        peakX,
        peakY,
        4,
        0,
        Math.PI * 2
      );

      ctx.fill();


      /* ===================================================
         GUIDE LINE FROM PEAK TO MEMBRANE
         =================================================== */

      ctx.save();

      ctx.strokeStyle =
        "#0066ff";

      ctx.lineWidth =
        1.5;

      ctx.setLineDash(
        [5, 5]
      );

      ctx.beginPath();

      ctx.moveTo(
        peakX,
        peakY + 7
      );

      ctx.lineTo(
        peakX,
        membraneY - 7
      );

      ctx.stroke();

      ctx.restore();


      /* Reset */

      ctx.strokeStyle =
        "#000";

      ctx.fillStyle =
        "#000";

      ctx.lineWidth =
        1;
    }


    /* =====================================================
       ANIMATION LOOP
       ===================================================== */

    function animate(timestamp) {

      if (!isPlaying) {

        animationFrameId =
          null;

        drawDiagram(0);

        return;
      }

      if (!animationStartTime) {

        animationStartTime =
          timestamp;
      }

      const elapsedSeconds =
        (
          timestamp -
          animationStartTime
        ) /
        1000;

      drawDiagram(
        elapsedSeconds
      );

      animationFrameId =
        requestAnimationFrame(
          animate
        );
    }


    function startAnimation() {

      animationStartTime =
        0;

      if (!animationFrameId) {

        animationFrameId =
          requestAnimationFrame(
            animate
          );
      }
    }


    function stopAnimation() {

      if (animationFrameId) {

        cancelAnimationFrame(
          animationFrameId
        );

        animationFrameId =
          null;
      }

      animationStartTime =
        0;

      drawDiagram(0);
    }


    /* =====================================================
       START PURE TONE
       ===================================================== */

    async function startTone() {

      const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;

      if (!AudioContextClass) {
        return;
      }

      if (!audioContext) {

        audioContext =
          new AudioContextClass();
      }

      if (
        audioContext.state ===
        "suspended"
      ) {

        await audioContext.resume();
      }

      oscillator =
        audioContext.createOscillator();

      gainNode =
        audioContext.createGain();

      oscillator.type =
        "sine";

      oscillator.frequency.setValueAtTime(
        Number(pitchSlider.value),
        audioContext.currentTime
      );

      gainNode.gain.setValueAtTime(
        0,
        audioContext.currentTime
      );

      gainNode.gain.linearRampToValueAtTime(
        getAudioGain(),
        audioContext.currentTime + 0.03
      );

      oscillator.connect(
        gainNode
      );

      gainNode.connect(
        audioContext.destination
      );

      oscillator.start();

      isPlaying =
        true;

      toggleBtn.textContent =
        "Stop";

      startAnimation();
    }


    /* =====================================================
       STOP PURE TONE
       ===================================================== */

    function stopTone() {

      if (
        !oscillator ||
        !audioContext ||
        !gainNode
      ) {

        isPlaying =
          false;

        toggleBtn.textContent =
          "Play";

        stopAnimation();

        return;
      }

      const now =
        audioContext.currentTime;

      gainNode.gain.cancelScheduledValues(
        now
      );

      gainNode.gain.setValueAtTime(
        gainNode.gain.value,
        now
      );

      gainNode.gain.linearRampToValueAtTime(
        0,
        now + 0.03
      );

      oscillator.stop(
        now + 0.04
      );

      oscillator =
        null;

      gainNode =
        null;

      isPlaying =
        false;

      toggleBtn.textContent =
        "Play";

      stopAnimation();
    }


    /* =====================================================
       PLAY / STOP
       ===================================================== */

    toggleBtn.addEventListener(
      "click",
      async () => {

        if (isPlaying) {
          stopTone();
        }
        else {
          await startTone();
        }
      }
    );


    /* =====================================================
       FREQUENCY
       ===================================================== */

    pitchSlider.addEventListener(
      "input",
      () => {

        const frequency =
          Number(pitchSlider.value);

        frequencyValue.textContent =
          frequency + " Hz";

        updateSliderFill(
          pitchSlider
        );

        if (
          oscillator &&
          audioContext
        ) {

          oscillator.frequency.setTargetAtTime(
            frequency,
            audioContext.currentTime,
            0.01
          );
        }

        drawDiagram(0);
      }
    );


    /* =====================================================
       INTENSITY
       ===================================================== */

    intensitySlider.addEventListener(
      "input",
      () => {

        const intensity =
          Number(intensitySlider.value);

        intensityValue.textContent =
          intensity + "%";

        updateSliderFill(
          intensitySlider
        );

        /*
          Change audible intensity immediately.
        */
        if (
          gainNode &&
          audioContext
        ) {

          gainNode.gain.setTargetAtTime(
            getAudioGain(),
            audioContext.currentTime,
            0.01
          );
        }

        /*
          Jitter magnitude also changes immediately.
        */
        drawDiagram(0);
      }
    );


    /* =====================================================
       MUTE / UNMUTE
       ===================================================== */

    muteCheckbox.addEventListener(
      "change",
      () => {

        /*
          Mute affects the audio only.
          The visual vibration continues while Play is active.
        */
        if (
          gainNode &&
          audioContext
        ) {

          gainNode.gain.setTargetAtTime(
            getAudioGain(),
            audioContext.currentTime,
            0.01
          );
        }
      }
    );


    /* =====================================================
       RESPONSIVE RESIZING
       ===================================================== */

    let resizeObserver = null;

    if ("ResizeObserver" in window) {

      resizeObserver =
        new ResizeObserver(() => {

          resizeCanvas();
        });

      resizeObserver.observe(
        canvas.parentElement
      );
    }

    /*
      Window resize is retained even when ResizeObserver
      exists because browser zoom and some display changes
      are reported more reliably this way.
    */
    window.addEventListener(
      "resize",
      resizeCanvas
    );

    /*
      Helps when a phone/tablet rotates.
    */
    window.addEventListener(
      "orientationchange",
      () => {

        window.setTimeout(
          resizeCanvas,
          120
        );
      }
    );

    /*
      Redraw after fonts/layout have fully settled.
    */
    window.addEventListener(
      "load",
      resizeCanvas
    );


    /* =====================================================
       INITIAL DRAW
       ===================================================== */

    updateSliderFill(
      pitchSlider
    );

    updateSliderFill(
      intensitySlider
    );

    resizeCanvas();

  </script>

</body>
</html>
